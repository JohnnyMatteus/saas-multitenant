global:
  scrape_interval: 15s

scrape_configs:
  - job_name: studio-api
    metrics_path: /metrics
    # Fora de dev a API exige METRICS_TOKEN: descomente e monte o arquivo.
    # authorization:
    #   credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["app:8000"]
