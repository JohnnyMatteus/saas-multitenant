server {
  listen 8080;
  root /usr/share/nginx/html;

  # Cabeçalhos em toda resposta. A CSP libera só o Keycloak como destino de
  # conexão e de redirecionamento do login; ajuste connect-src ao trocar o IdP.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # /metrics e rotas de integração não são do navegador: só /api/v1 passa.
  location /api/v1/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    client_max_body_size 3m;
  }

  location /api/ {
    return 404;
  }

  location = /metrics {
    return 404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # SPA: rotas do vue-router caem no index.html.
  location / {
    try_files $uri /index.html;
  }
}
