server {
  listen 8080;
  root /usr/share/nginx/html;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Integração (agente de WhatsApp, conta de serviço) não é do navegador: fica fora do front.
  # Location de prefixo casa pelo caminho já normalizado (%2e, %2F, //), então não há desvio por codificação.
  location /api/v1/integrations/ {
    return 404;
  }

  # Do navegador só passa /api/v1 (o resto de /api e /metrics dão 404 abaixo).
  location /api/v1/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    client_max_body_size 3m;
  }

  location /api/ {
    return 404;
  }

  location = /metrics {
    return 404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA: rotas do vue-router caem no index.html.
  location / {
    try_files $uri /index.html;
  }
}
