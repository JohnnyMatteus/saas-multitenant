# Ambiente local. Todas as senhas são de DEV, públicas por definição
# ("dev-only-change-me"); nunca as reutilize. Valores ajustáveis via .env
# (veja .env.example). Perfis:
#   core          API, worker, MySQL, Redis, Keycloak, Mailpit, LocalStack (S3)
#   observability Prometheus raspando /metrics
#   tools         Adminer
# Atalhos no Makefile (make up, make down, make test...).
name: saas-multitenant

x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "false"
  # Chave de DEV, pública. Em produção vem de um cofre de segredos.
  APP_KEY: "base64:ZGV2LW9ubHktY2hhbmdlLW1lLTAxMjM0NTY3ODlhYmM="
  LOG_CHANNEL: json
  LOG_LEVEL: info
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: studio
  DB_USERNAME: studio
  DB_PASSWORD: ${MYSQL_PASSWORD:-dev-only-change-me}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: agenda@example.com
  METRICS_STORAGE: apcu
  AUTH_JWT_MODE: jwks
  AUTH_JWT_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/estudios
  AUTH_JWT_AUDIENCE: studio-api
  AUTH_JWT_JWKS_URI: http://keycloak:8080/realms/estudios/protocol/openid-connect/certs
  # S3 emulado pelo LocalStack; na AWS real basta remover AWS_ENDPOINT e trocar as credenciais.
  STUDIO_MEDIA_DISK: s3
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: ${STUDIO_MEDIA_BUCKET:-studio-media}
  AWS_ENDPOINT: http://localstack:4566
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

x-app: &app
  build: .
  image: saas-multitenant-app:dev
  environment: *app-env
  networks: [studio-net]

services:
  mysql:
    image: mysql:8.4.13
    profiles: [core]
    # skip-name-resolve evita DNS reverso a cada conexão (lento no Docker Desktop).
    command: ["--skip-name-resolve"]
    environment:
      MYSQL_DATABASE: studio
      MYSQL_USER: studio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev-only-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev-only-change-me}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    networks: [studio-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      # A primeira inicialização (carga de fusos e init.sql) é lenta.
      start_period: 120s

  redis:
    image: redis:7.4.6-alpine
    profiles: [core]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    networks: [studio-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    profiles: [core]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-change-me}
      # Emissor fixo: tokens pedidos pelo host (localhost) e validados pela
      # app (que busca o JWKS em keycloak:8080) têm o mesmo "iss".
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./docker/keycloak/realm-estudios.json:/opt/keycloak/data/import/realm-estudios.json:ro
    networks: [studio-net]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mailpit:
    image: axllent/mailpit:v1.27.10
    profiles: [core]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks: [studio-net]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4.7.0
    profiles: [core]
    environment:
      SERVICES: s3
      STUDIO_MEDIA_BUCKET: ${STUDIO_MEDIA_BUCKET:-studio-media}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./docker/localstack:/etc/localstack/init/ready.d:ro
    networks: [studio-net]
    healthcheck:
      # Pronto só depois do script de bootstrap (bucket criado).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_localstack/init/ready | grep -Eq '\"completed\": ?true'"]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    profiles: [core]
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --force"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *app
    profiles: [core]
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    profiles: [core]
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5

  web:
    build: ./web
    image: saas-multitenant-web:dev
    profiles: [core]
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      app:
        condition: service_healthy
    networks: [studio-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  scheduler:
    <<: *app
    profiles: [core]
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [studio-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:5.3.0
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    networks: [studio-net]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  localstack-data:
  prometheus-data:

networks:
  studio-net:
    name: studio-net
